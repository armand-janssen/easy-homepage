<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Easy Homepage</title>
  <style>
    /* Dark mode styles for Easy Homepage */
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #181a1b;
      color: #e0e0e0;
    }
    header {
      background: #222b3a;
      color: #fff;
      padding: 1rem;
      text-align: center;
      font-size: 1.5rem;
    }
    nav {
      display: flex;
      flex-wrap: wrap;
      background: #23272e;
      border-bottom: 1px solid #333;
    }
    nav button {
      flex: 1;
      padding: 0.75rem;
      border: none;
      background: #23272e;
      color: #e0e0e0;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }
    nav button.active {
      background: #181a1b;
      border-bottom: 3px solid #4f8cff;
      color: #fff;
    }
    .tab-content {
      display: none;
      flex-direction: row;
      gap: 2rem;
      flex-wrap: wrap;
      padding: 1rem;
    }
    .tab-content.active {
      display: flex;
    }
    .category {
      flex: 1 1 250px;
      max-width: 320px;
      min-width: 200px;
      background: #23272e;
      border-radius: 8px;
      padding: 1rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      margin-bottom: 0;
      display: flex;
      flex-direction: column;
    }
    .category h2 {
      font-size: 1.2rem;
      margin-bottom: 0.5rem;
      color: #fff;
      padding: 0.4em 0.8em;
      border-radius: 6px;
      background: #4f8cff;
    }
    /* Alternate colors for more categories */
    .category:nth-of-type(2) h2 { background: #43a047; }
    .category:nth-of-type(3) h2 { background: #ffb300; color: #222; }
    .category:nth-of-type(4) h2 { background: #e53935; }
    .category:nth-of-type(5) h2 { background: #8e24aa; }
    .links {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .link-card {
      display: flex;
      align-items: center;
      padding: 4px 0;
      border: none;
      background: none;
      box-shadow: none;
    }
    .link-card img {
      width: 24px;
      height: 24px;
      object-fit: contain;
      margin-right: 8px;
      vertical-align: middle;
      filter: brightness(0.9) drop-shadow(0 0 1px #222);
      background: #181a1b;
      border-radius: 4px;
    }
    .link-card a {
      text-decoration: none;
      color: #e0e0e0;
      font-size: 0.9rem;
      word-break: break-word;
      transition: color 0.2s;
    }
    .link-card a:hover {
      color: #4f8cff;
    }
    @media (max-width: 600px) {
      nav button {
        font-size: 0.85rem;
      }
      .tab-content {
        flex-direction: column;
        gap: 1rem;
        padding: 0.5rem;
      }
      .category {
        max-width: 100%;
        min-width: 0;
      }
    }
  </style>
</head>
<body>
  <header>Easy Homepage</header>
  <nav id="tabs"></nav>
  <div id="tab-contents"></div>

  <script>
    async function fetchSites() {
      const res = await fetch('/api/sites');
      return res.json();
    }

    function createTabButton(tabName, index) {
      const btn = document.createElement('button');
      btn.textContent = tabName;
      btn.addEventListener('click', () => {
        document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.getElementById('tab-' + index).classList.add('active');
      });
      return btn;
    }

    function createCategory(category) {
      const div = document.createElement('div');
      div.classList.add('category');

      const title = document.createElement('h2');
      title.textContent = category.category;
      div.appendChild(title);

      const linksDiv = document.createElement('div');
      linksDiv.classList.add('links');

      category.links.forEach(link => {
        const card = document.createElement('div');
        card.classList.add('link-card');

        const img = document.createElement('img');
        img.src = link["icon-file"] ? `public/icons/${link["icon-file"]}` : `public/icons/default.png`;
        img.alt = link.name;
        card.appendChild(img);

        const a = document.createElement('a');
        a.href = link.url;
        a.target = '_blank';
        a.textContent = link.name;
        card.appendChild(a);

        linksDiv.appendChild(card);
      });

      div.appendChild(linksDiv);
      return div;
    }

    async function renderTabs() {
      const sites = await fetchSites();
      const tabsNav = document.getElementById('tabs');
      const tabContents = document.getElementById('tab-contents');

      sites.tabs.forEach((tab, idx) => {
        const btn = createTabButton(tab.tab, idx);
        if (idx === 0) btn.classList.add('active');
        tabsNav.appendChild(btn);

        const tabDiv = document.createElement('div');
        tabDiv.classList.add('tab-content');
        if (idx === 0) tabDiv.classList.add('active');
        tabDiv.id = 'tab-' + idx;

        tab.categories.forEach(category => {
          tabDiv.appendChild(createCategory(category));
        });

        tabContents.appendChild(tabDiv);
      });
    }

    renderTabs();
  </script>
</body>
</html>
